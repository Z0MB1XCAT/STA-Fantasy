name: Keep Supabase awake

# Free Supabase projects pause after 7 days with no activity. This pings the database twice a week
# (it only reads the public rounds table, using the same publishable key the website uses).
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the rounds table
        run: |
          curl --fail --silent --show-error \
            "https://tmqjpfqfumqfoxcyoicj.supabase.co/rest/v1/rounds?select=id&limit=1" \
            -H "apikey: sb_publishable_mzYEaF8D9tDHt7-qIDxjOg_TSTqp9nr"
